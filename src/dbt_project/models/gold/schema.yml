version: 2

models:
  - name: gold_icd10_clinical_index
    description: "Gold layer clinical index for searchable ICD-10 codes."
    columns:
      - name: formatted_icd10_code
        description: "Standardized code with proper decimal placement."
        tests:
          - unique
          - not_null
      - name: long_description
        description: "The long-form clinical description of the code from the most recent fiscal year."
        tests:
          - not_null

  - name: gold_icd10_billable_leaves
    description: "Gold layer billable leaves for ICD-10 codes."
    columns:
      - name: coreason_id
        description: "UUID5 Identity Resolution based on the ICD10 Namespace and formatted code."
        tests:
          - unique
          - not_null
      - name: is_billable
        description: "Boolean indicating if the code is billable."
        tests:
          - accepted_values:
              values: [true]
