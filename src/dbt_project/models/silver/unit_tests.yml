unit_tests:
  - name: test_icd10_decimal_injector
    description: "Validates the `icd10_decimal_injector` macro through the `icd10_ontology` model. Ensures codes <= 3 chars remain unchanged, and codes > 3 chars get a decimal after the 3rd character."
    model: coreason_etl_icd_10_silver_icd10_ontology
    given:
      - input: source('bronze', 'icd10_cm_raw')
        format: dict
        rows:
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "A00", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "A000", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "A0000", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "E119   ", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "E11", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "  Z00  ", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "V0100XA", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
          - { "fiscal_year": 2024, "raw_data": { "raw_code": "A", "short_description": "short", "long_description": "long", "hipaa_flag": "1" } }
    expect:
      format: dict
      rows:
        - { "raw_code_string": "A00", "formatted_icd10_code": "A00" }
        - { "raw_code_string": "A000", "formatted_icd10_code": "A00.0" }
        - { "raw_code_string": "A0000", "formatted_icd10_code": "A00.00" }
        - { "raw_code_string": "E119", "formatted_icd10_code": "E11.9" }
        - { "raw_code_string": "E11", "formatted_icd10_code": "E11" }
        - { "raw_code_string": "Z00", "formatted_icd10_code": "Z00" }
        - { "raw_code_string": "V0100XA", "formatted_icd10_code": "V01.00XA" }
        - { "raw_code_string": "A", "formatted_icd10_code": "A" }
